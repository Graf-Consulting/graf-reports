name: Gerar estudo

# Modo A da esteira (docs/fluxo-da-esteira.md): quando um push no PR muda as
# entradas de um estudo em content/reports/<slug>/, o agente roda as skills
# 01 a 06 e faz commit da composição e da página no próprio PR.
#
# Também pode ser disparado à mão (aba Actions → Gerar estudo → Run workflow),
# informando o número do PR, para gerar de novo sem mudar as entradas, por
# exemplo depois de uma mudança no kit.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'content/reports/**'
  workflow_dispatch:
    inputs:
      pr:
        description: 'Número do PR do estudo'
        required: true
      slugs:
        description: 'Slugs a gerar, separados por espaço (vazio: todos os estudos que o PR altera)'
        required: false
        default: ''

concurrency:
  group: gerar-estudo-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  detectar:
    # No PR, o filtro "paths" olha o diff inteiro. Este job olha só o último push,
    # para que os commits do próprio agente (que só mexem em app/) não gerem de novo.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      slugs: ${{ steps.slugs.outputs.slugs }}
      pr: ${{ steps.slugs.outputs.pr }}
      branch: ${{ steps.slugs.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: slugs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
          ACAO: ${{ github.event.action }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_EVENTO: ${{ github.event.pull_request.number }}
          BRANCH_EVENTO: ${{ github.event.pull_request.head.ref }}
          PR_MANUAL: ${{ inputs.pr }}
          SLUGS_MANUAL: ${{ inputs.slugs }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            PR="$PR_MANUAL"
            ESTADO=$(gh pr view "$PR" --json state --jq .state)
            if [ "$ESTADO" != "OPEN" ]; then echo "::error::O PR #$PR não está aberto ($ESTADO)."; exit 1; fi
            BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
            if [ -n "$SLUGS_MANUAL" ]; then
              SLUGS="$SLUGS_MANUAL"
            else
              SLUGS=$(gh pr diff "$PR" --name-only | grep '^content/reports/' | cut -d/ -f3 | sort -u | tr '\n' ' ' | xargs)
            fi
          else
            PR="$PR_EVENTO"
            BRANCH="$BRANCH_EVENTO"
            if [ "$ACAO" = "synchronize" ] && [ -n "$ANTES" ] && git cat-file -e "$ANTES" 2>/dev/null; then
              DE="$ANTES"
            else
              DE="$BASE"
            fi
            SLUGS=$(git diff --name-only "$DE" "$DEPOIS" -- content/reports/ | cut -d/ -f3 | sort -u | tr '\n' ' ' | xargs)
          fi
          echo "PR #$PR, branch $BRANCH. Estudos a gerar: ${SLUGS:-nenhum}"
          {
            echo "slugs=$SLUGS"
            echo "pr=$PR"
            echo "branch=$BRANCH"
          } >> "$GITHUB_OUTPUT"

  gerar:
    needs: detectar
    if: needs.detectar.outputs.slugs != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.detectar.outputs.branch }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Guardar o commit inicial
        id: antes
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rodar as skills da esteira
        id: agente
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Você é o agente de geração da esteira de estudos deste repositório, no modo A
            (docs/fluxo-da-esteira.md). Siga o CLAUDE.md e as skills em .claude/skills/.

            PR: #${{ needs.detectar.outputs.pr }}, branch ${{ needs.detectar.outputs.branch }}.
            Estudos a gerar: ${{ needs.detectar.outputs.slugs }}

            Para cada slug, siga as skills nesta ordem:
            1. 01-validar-entradas. Se reprovar, comente no PR os erros e avisos e pare este estudo.
            2. 02-compor-report.
            3. 03-gerar-componente, para cada bloco proprio reservado na composição, quando o kit
               não cobre o que o guideline pede. Falta de bloco no kit não é motivo para parar.
            4. 04-montar-pagina, só se app/reports/<slug>/page.tsx ainda não existir.
            5. 05-conferir-report. Se reprovar, comente no PR o relatório e pare este estudo.
            6. Faça commit só dos arquivos de app/reports/<slug>/, com mensagem em português
               no padrão Conventional Commits, e dê push na branch do PR.
            7. 06-abrir-pr no modo A: atualize a descrição do PR com o resumo da geração.

            Nunca altere content/, components/ (o kit, na raiz), lib/, app/layout.tsx nem app/globals.css.
            Componentes próprios ficam em app/reports/<slug>/components/.
            Nunca faça merge.
          claude_args: >-
            --allowedTools
            "Read,Write,Edit,Glob,Grep,Bash(npm run validar:*),Bash(npm run lint),Bash(npx tsc --noEmit),Bash(npm run build),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"

      # Roda mesmo se o agente falhar, para o custo de toda execução ficar registrado no PR.
      - name: Registrar o custo da geração
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ARQUIVO: ${{ steps.agente.outputs.execution_file }}
          PR_COMENTARIO: ${{ needs.detectar.outputs.pr }}
          BRANCH: ${{ needs.detectar.outputs.branch }}
          ANTES: ${{ steps.antes.outputs.sha }}
          SLUGS: ${{ needs.detectar.outputs.slugs }}
          EVENTO: ${{ github.event_name }}
        run: |
          # Gerou se o agente fez push de algum commit na branch do PR.
          DEPOIS=$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)
          if [ -n "$DEPOIS" ] && [ "$DEPOIS" != "$ANTES" ]; then RESULTADO="gerou commit ${DEPOIS:0:7}"; else RESULTADO="sem commit"; fi
          GATILHO=$([ "$EVENTO" = "workflow_dispatch" ] && echo "disparo manual" || echo "push no PR")
          export RESULTADO ROTULO="Geração de $SLUGS ($GATILHO)"
          bash .github/scripts/custo-do-agente.sh
