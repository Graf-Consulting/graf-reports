name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Pedidos de ajuste num PR de estudo seguem a skill 07-aplicar-ajuste: o agente
          # responde com sugestões de alteração ("suggested change") no guideline.md, e uma
          # pessoa aceita com "Commit suggestion". O agente não faz commit em content/;
          # o workflow Validação reprova o PR se um commit de bot alterar content/.
          claude_args: >-
            --allowedTools
            "mcp__github_inline_comment__create_inline_comment,Read,Glob,Grep,Bash(npm ci),Bash(npm run validar:*),Bash(gh pr view:*),Bash(gh pr diff:*)"

      # Custo da execução no resumo do job. Sem comentário no PR: este workflow só lê o PR.
      - name: Registrar o custo
        if: always()
        env:
          ARQUIVO: ${{ steps.claude.outputs.execution_file }}
          ROTULO: Pedido com @claude
        run: bash .github/scripts/custo-do-agente.sh

